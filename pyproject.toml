[project]
name = "ledfx-performance"
version = "0.1.0"
description = "External LedFx application performance and output validation tools"
license = "GPL-3.0-only"
license-files = ["PERFORMANCE-LICENSE"]
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10", "numpy>=2", "psutil>=5.9", "pillow>=10", "pydantic>=2"]

[project.scripts]
ledfx-pixel-bench = "ledfx_performance.pixel:main"
ledfx-paired-bench = "ledfx_performance.matrix:main"
ledfx-profile-report = "ledfx_performance.profiles:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.16.8", "pyrefly==1.3.1", "types-psutil>=5.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledfx_performance"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src"]
python-version = "3.11"
