name: Performance tools quality
on:
  workflow_dispatch:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/performance.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/performance.yml"]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyrefly check
      - run: uv run pytest -q
